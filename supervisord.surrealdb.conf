# SurrealDB program for the single-container image only.
# Appended to supervisord.conf at build time (see the `single` stage in the Dockerfile).
# sh -c so ${SURREAL_USER:-root} / ${SURREAL_PASSWORD:-root} are expanded by the
# shell (supervisord's command= does not run through a shell): the embedded DB
# must use the SAME credentials the app is configured with, otherwise the app
# cannot authenticate once SURREAL_USER / SURREAL_PASSWORD are customized.

[program:surrealdb]
command=sh -c 'exec surreal start --log trace --user "${SURREAL_USER:-root}" --pass "${SURREAL_PASSWORD:-root}" rocksdb:/mydata/mydatabase.db'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5
autostart=true
startsecs=5
