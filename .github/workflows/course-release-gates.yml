name: Course Release Gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gold-source-runtime:
    name: Gold source runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Verify CC0 gold fixture integrity
        run: uv run pytest tests/course/test_gold_source_fixtures.py -v

      - name: Extract the gold PDF and PPTX with real Docling
        env:
          OPEN_NOTEBOOK_RUN_REAL_DOCLING_SMOKE: "1"
        run: uv run pytest tests/course/test_real_docling_preview_smoke.py -v

  course-migration-disk:
    name: Course migration disk gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Verify temporary RocksDB upgrade, restart, downgrade, and rollback
        run: ./scripts/verify-course-migration-gate.sh

  course-browser-accessibility:
    name: Course browser accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run keyboard and axe checks on Course product routes
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: course-playwright-report
          path: frontend/test-results/playwright-report
          if-no-files-found: ignore
          retention-days: 7
